<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LFM3 Swarm Monitor</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #12151d; --panel2: #171b25; --line: #232837;
    --text: #e6e8ee; --muted: #8a90a2; --dim: #4b5163;
    --green: #3ddc84; --amber: #f5b942; --red: #ff5d5d; --blue: #5aa9ff;
    --violet: #a78bfa; --pink: #f472b6; --cyan: #22d3ee;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width: 1500px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .sub { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .kpi .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .kpi .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .kpi .v small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 3px; }
  .kpi.hero { border-color: #1f4d36; background: linear-gradient(180deg, #11231a, var(--panel)); }
  .kpi.hero .v { color: var(--green); font-size: 28px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--cyan); transition: width .4s; }
  .grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 14px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted);
             margin: 0 0 10px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card h2 .r { margin-left: auto; text-transform: none; letter-spacing: 0; }
  canvas { width: 100%; height: 220px; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 3px; border-radius: 2px;
                         background: var(--c); margin-right: 6px; vertical-align: middle; }
  .inst { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .inst .top { display: flex; gap: 14px; align-items: baseline; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .inst .name { font-weight: 650; }
  .inst .m { color: var(--muted); font-size: 12px; }
  .inst .m b { color: var(--text); font-weight: 600; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 4px; }
  .slot { height: 30px; border-radius: 5px; background: #1c2130; border: 1px solid #242a3a; position: relative;
          font-size: 10px; color: transparent; display: flex; align-items: center; justify-content: center;
          font-variant-numeric: tabular-nums; transition: background .3s, border-color .3s; }
  .slot.pp { background: #3a2d10; border-color: var(--amber); color: var(--amber); }
  .slot.gen { background: color-mix(in srgb, var(--green) calc(var(--f) * 55% + 15%), #1c2130);
              border-color: var(--green); color: #04170c; font-weight: 700; }
  .agents { max-height: 330px; overflow: auto; }
  .row { display: flex; align-items: center; gap: 8px; padding: 5px 2px; border-bottom: 1px solid var(--line);
         font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .row:last-child { border-bottom: 0; }
  .role { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; padding: 2px 6px; border-radius: 4px;
          font-weight: 700; min-width: 74px; text-align: center; }
  .role.planner { background: #2a2148; color: var(--violet); }
  .role.worker { background: #14304d; color: var(--blue); }
  .role.reviewer { background: #3a2d10; color: var(--amber); }
  .role.synthesizer { background: #3d1a31; color: var(--pink); }
  .role.client { background: #1e2433; color: var(--muted); }
  .row .id { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .t { color: var(--muted); }
  .ok { color: var(--green); } .ko { color: var(--red); }
  .empty { color: var(--dim); font-size: 12px; padding: 8px 2px; }
  .key { display: flex; gap: 12px; font-size: 11px; color: var(--muted); }
  .key i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>LFM3 Swarm Monitor</h1>
    <span class="live"><span class="dot" id="dot"></span><span id="conn">connecting…</span></span>
    <span class="sub" id="sub"></span>
  </header>

  <div class="kpis">
    <div class="kpi hero"><div class="l">Throughput</div><div class="v" id="k-tps">0<small>tok/s</small></div></div>
    <div class="kpi"><div class="l">Peak</div><div class="v" id="k-peak">0<small>tok/s</small></div></div>
    <div class="kpi"><div class="l">Active agents</div><div class="v" id="k-active">0</div></div>
    <div class="kpi"><div class="l">Slots busy</div><div class="v" id="k-slots">0</div></div>
    <div class="kpi"><div class="l">Calls done</div><div class="v" id="k-done">0</div></div>
    <div class="kpi"><div class="l">Errors</div><div class="v" id="k-err">0</div></div>
    <div class="kpi"><div class="l">Tokens generated</div><div class="v" id="k-tok">0</div></div>
    <div class="kpi"><div class="l">GPU</div><div class="v" id="k-gpu">–<small>%</small></div><div class="bar"><i id="b-gpu" style="width:0"></i></div></div>
    <div class="kpi"><div class="l">VRAM</div><div class="v" id="k-vram">–</div><div class="bar"><i id="b-vram" style="width:0"></i></div></div>
    <div class="kpi"><div class="l">Power · Temp</div><div class="v" id="k-pow">–</div></div>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <h2>Generation throughput <span class="r" id="chart-r"></span></h2>
        <canvas id="chart"></canvas>
        <div class="legend" id="legend"></div>
      </div>
      <div class="card">
        <h2>Instances &amp; slots
          <span class="r key"><span><i style="background:#1c2130;border:1px solid #242a3a"></i>idle</span>
          <span><i style="background:var(--amber)"></i>prompt</span>
          <span><i style="background:var(--green)"></i>generating (tokens)</span></span></h2>
        <div id="insts"></div>
      </div>
    </div>
    <div>
      <div class="card">
        <h2>Active agents <span class="r" id="act-n"></span></h2>
        <div class="agents" id="active"></div>
      </div>
      <div class="card">
        <h2>Recent completions</h2>
        <div class="agents" id="recent"></div>
      </div>
    </div>
  </div>
</div>

<script>
const COLORS = ["#5aa9ff", "#f5b942", "#a78bfa", "#f472b6", "#22d3ee", "#fb923c"];
const $ = (id) => document.getElementById(id);
const fmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(Math.round(n));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const t0 = Date.now();

function drawChart(hist, nb) {
  const c = $("chart"), dpr = devicePixelRatio || 1;
  const W = c.clientWidth, H = c.clientHeight;
  if (c.width !== W * dpr) { c.width = W * dpr; c.height = H * dpr; }
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const L = 44, R = 8, T = 8, B = 20, w = W - L - R, h = H - T - B;
  const max = Math.max(200, ...hist.map((p) => p[1])) * 1.1;
  const step = max > 1500 ? 500 : max > 600 ? 200 : 100;
  g.font = "11px ui-sans-serif, system-ui"; g.fillStyle = "#8a90a2"; g.strokeStyle = "#232837"; g.lineWidth = 1;
  for (let v = 0; v <= max; v += step) {
    const y = T + h - (v / max) * h;
    g.beginPath(); g.moveTo(L, y); g.lineTo(L + w, y); g.stroke();
    g.fillText(v, 4, y + 4);
  }
  if (hist.length < 2) return;
  const tN = hist[hist.length - 1][0], span = 120;
  const X = (t) => L + w - ((tN - t) / span) * w;
  const Y = (v) => T + h - (v / max) * h;
  const pts = hist.filter((p) => tN - p[0] <= span);
  for (let i = 0; i < nb; i++) {
    g.strokeStyle = COLORS[i % COLORS.length]; g.globalAlpha = .7; g.lineWidth = 1.5; g.beginPath();
    pts.forEach((p, j) => (j ? g.lineTo : g.moveTo).call(g, X(p[0]), Y(p[2][i] || 0)));
    g.stroke();
  }
  g.globalAlpha = 1;
  const grad = g.createLinearGradient(0, T, 0, T + h);
  grad.addColorStop(0, "rgba(61,220,132,.35)"); grad.addColorStop(1, "rgba(61,220,132,0)");
  g.beginPath(); g.moveTo(X(pts[0][0]), Y(0));
  pts.forEach((p) => g.lineTo(X(p[0]), Y(p[1])));
  g.lineTo(X(pts[pts.length - 1][0]), Y(0)); g.closePath(); g.fillStyle = grad; g.fill();
  g.strokeStyle = "#3ddc84"; g.lineWidth = 2.2; g.beginPath();
  pts.forEach((p, j) => (j ? g.lineTo : g.moveTo).call(g, X(p[0]), Y(p[1])));
  g.stroke();
  g.fillStyle = "#8a90a2"; g.fillText("-2 min", L, H - 4); g.fillText("now", L + w - 22, H - 4);
}

function render(s) {
  const hist = s.history, last = hist.length ? hist[hist.length - 1] : [0, 0, []];
  const busy = s.backends.reduce((a, b) => a + b.slots.filter((x) => x.busy).length, 0);
  const total = s.backends.reduce((a, b) => a + b.slots.length, 0);
  $("k-tps").innerHTML = Math.round(last[1]) + "<small>tok/s</small>";
  $("k-peak").innerHTML = Math.round(s.peak_tps) + "<small>tok/s</small>";
  $("k-active").textContent = s.agents.length;
  $("k-slots").innerHTML = busy + "<small>/ " + total + "</small>";
  $("k-done").textContent = fmt(s.done);
  $("k-err").textContent = s.errors;
  $("k-err").style.color = s.errors ? "var(--red)" : "";
  $("k-tok").textContent = fmt(s.gen_tokens);
  const gp = s.gpu || {};
  if (gp.util !== undefined) {
    $("k-gpu").innerHTML = gp.util + "<small>%</small>"; $("b-gpu").style.width = gp.util + "%";
    $("k-vram").innerHTML = (gp.mem / 1024).toFixed(1) + "<small>/ " + (gp.mem_total / 1024).toFixed(0) + " GB</small>";
    $("b-vram").style.width = (100 * gp.mem / gp.mem_total) + "%";
    $("k-pow").innerHTML = Math.round(gp.power) + "<small>W</small> " + gp.temp + "<small>°C</small>";
  }
  $("sub").textContent = s.backends.length + " instance(s) · " + total + " slots · uptime " + Math.round((Date.now() - t0) / 1000) + "s";

  drawChart(hist, s.backends.length);
  $("legend").innerHTML = '<span style="--c:#3ddc84">total</span>' +
    s.backends.map((b, i) => `<span style="--c:${COLORS[i % COLORS.length]}">:${b.port}</span>`).join("");
  $("chart-r").textContent = "last " + Math.round(last[1]) + " tok/s";

  $("insts").innerHTML = s.backends.map((b, i) => {
    const cells = b.slots.map((x) => {
      if (!x.busy) return `<div class="slot" title="slot ${x.id}: idle"></div>`;
      if (x.n === 0) return `<div class="slot pp" title="slot ${x.id}: prompt ${x.pp}/${x.np}">P</div>`;
      const f = Math.min(1, x.n / 400).toFixed(2);
      return `<div class="slot gen" style="--f:${f}" title="slot ${x.id}: ${x.n} tokens">${x.n}</div>`;
    }).join("");
    const nb = b.slots.filter((x) => x.busy).length;
    return `<div class="inst"><div class="top">
      <span class="name" style="color:${COLORS[i % COLORS.length]}">:${b.port}</span>
      <span class="m">${b.up ? "" : '<b class="ko">DOWN</b> '}gen <b>${Math.round(b.tps)}</b> tok/s</span>
      <span class="m">prompt <b>${fmt(b.pp_tps)}</b> tok/s</span>
      <span class="m">busy <b>${nb}</b>/${b.slots.length}</span>
      <span class="m">in-flight <b>${b.inflight}</b></span></div>
      <div class="slots">${cells}</div></div>`;
  }).join("");

  $("act-n").textContent = s.agents.length ? s.agents.length + " running" : "";
  $("active").innerHTML = s.agents.length ? s.agents.slice(0, 80).map((a) =>
    `<div class="row"><span class="role ${esc(a.role)}">${esc(a.role)}</span><span class="id">${esc(a.id)}</span>
     <span class="t">:${a.port}</span><span class="t">${a.elapsed.toFixed(1)}s</span></div>`).join("")
    : '<div class="empty">No agents running. Start one with: python swarm.py 32</div>';
  $("recent").innerHTML = s.recent.length ? s.recent.map((r) =>
    `<div class="row"><span class="role ${esc(r.role)}">${esc(r.role)}</span><span class="id">${esc(r.id)}</span>
     <span class="${r.ok ? "ok" : "ko"}">${r.ok ? r.tokens + " tok" : "error"}</span>
     <span class="t">${r.tps} t/s</span><span class="t">${r.secs}s</span></div>`).join("")
    : '<div class="empty">Nothing completed yet.</div>';
}

function connect() {
  const es = new EventSource("/events");
  es.onopen = () => { $("dot").classList.add("on"); $("conn").textContent = "live"; };
  es.onmessage = (e) => render(JSON.parse(e.data));
  es.onerror = () => { $("dot").classList.remove("on"); $("conn").textContent = "reconnecting…"; };
}
connect();
</script>
</body>
</html>
